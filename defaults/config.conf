# Anximi 配置。WebUI 会改写此文件；也可手动编辑后执行 `anximi apply`。
# 每个分类启用的手段（逗号分隔，留空=不处理该分类）：
#   net       网络拦截：hosts 域名 + 按 UID 的 iptables REJECT（system UID 只走 hosts）
#   disable   pm disable-user（所有选中用户；可还原）
#   uninstall pm uninstall -k --user（保留 APK，可用 install-existing 还原）
#   restrict  限制后台：appops 后台/自启/剪贴板/使用情况 + 撤销敏感运行时权限 + 待机分组 restricted
cat_ads=net,disable,restrict
cat_telemetry=net,disable,restrict
cat_cloudctl=net
cat_seccloud=net
cat_ai=net,disable,restrict
cat_cloud=

# 只处理风险不高于此级别的包（low / med / high）；单个包可在 packages.conf 里强制包含或跳过
risk_level=low

# 作用的用户：all = 所有用户（含第二空间、Island 工作资料、双开 999）；或写 "0 10"
users=all

# 区域：auto / cn / global（auto 按 ro.product.mod_device 等属性判断）
region=auto

# 网络拦截后端：iptables（默认，filter 表自有链 ANXIMI_OUT）/ bpf（实验：用户 0 走系统 chain3，其他用户回落 iptables）/ none（只用 hosts）
net_backend=iptables
# REJECT 或 DROP
net_target=REJECT
# 1 = 每 5 分钟检查一次 iptables 跳转是否被别的程序冲掉，冲掉则补回
net_watchdog=1
# 1 = 启用模块的 /system/etc/hosts（与其他 hosts 模块冲突时设 0，重启生效）
hosts=1

# 启用的系统设置项 id（见 lists/settings.list），空格或逗号分隔
settings=wifi_scan,ble_scan,ux_program,ux_debuglog

# 1 = 禁用 components.conf 里列出的组件
components=1

# 开机时自动执行一次 apply（补上新用户/新安装的同款组件、重建 iptables）
boot_apply=1

# 额外把 mihomo 规则集复制到这个目录。留空 = 自动：装了 Surfing 时复制到 /data/adb/box_bll/clash/rules；填 - = 不复制，只写 /data/adb/anximi/export
mihomo_export_dir=
